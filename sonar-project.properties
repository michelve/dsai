sonar.projectKey=michelve_dsai
sonar.organization=epikly

# Source code (excludes test files via sonar.exclusions)
sonar.sources=packages/@dsai-io/react/src,packages/@dsai-io/tools/src,packages/@dsai-io/figma-tokens/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.stories.tsx,**/*.figma.tsx,**/storybook-static/**,**/coverage/**,**/.nx/**,**/registry/**,**/fixtures/**,**/*.json,**/apps/**,**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Test files (disjoint from sources — colocated tests identified by patterns)
sonar.tests=packages/@dsai-io/react/src,packages/@dsai-io/tools/src,packages/@dsai-io/tools/test,packages/@dsai-io/figma-tokens/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.base.json
