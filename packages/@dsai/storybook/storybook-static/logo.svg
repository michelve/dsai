<svg width="200" height="40" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- DSAi Logo - Light theme (teal-based) -->
  
  <!-- DS letters with teal -->
  <text x="10" y="28" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#20c997">
    DS
  </text>
  
  <!-- AI letters with teal gradient -->
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1aa179;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="60" y="28" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#aiGradient)">
    Ai
  </text>
  
  <!-- Subtitle -->
  <text x="110" y="24" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#495057">
    Design System
  </text>
</svg>
