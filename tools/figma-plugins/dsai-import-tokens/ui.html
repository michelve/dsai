<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      background: #ffffff;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
    }
    .section {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #333333;
    }
    input[type="file"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      font-size: 11px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #18a0fb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0d8ce8;
    }
    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 11px;
      display: none;
    }
    .status.success {
      background: #d1f4e0;
      color: #0f5132;
      border: 1px solid #a3cfbb;
    }
    .status.error {
      background: #f8d7da;
      color: #842029;
      border: 1px solid #f1aeb5;
    }
    .status.info {
      background: #cfe2ff;
      color: #084298;
      border: 1px solid #9ec5fe;
    }
    .progress {
      margin-top: 8px;
      font-size: 10px;
      color: #666666;
    }
  </style>
</head>
<body>
  <h2>DSAI Import Tokens</h2>
  
  <div class="section">
    <label for="tokenFile">Select Token JSON File:</label>
    <input type="file" id="tokenFile" accept=".json" />
  </div>

  <button id="importBtn" disabled>Import Tokens</button>

  <div id="status" class="status"></div>

  <script>
    const fileInput = document.getElementById('tokenFile');
    const importBtn = document.getElementById('importBtn');
    const statusDiv = document.getElementById('status');

    fileInput.addEventListener('change', (e) => {
      importBtn.disabled = !e.target.files.length;
    });

    importBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      importBtn.disabled = true;
      showStatus('info', 'Reading file...');

      try {
        const text = await file.text();
        const data = JSON.parse(text);
        
        showStatus('info', 'Sending tokens to plugin...');
        parent.postMessage({ pluginMessage: { type: 'import-tokens', data } }, '*');
      } catch (error) {
        showStatus('error', `Error: ${error.message}`);
        importBtn.disabled = false;
      }
    });

    function showStatus(type, message) {
      statusDiv.className = `status ${type}`;
      statusDiv.style.display = 'block';
      statusDiv.textContent = message;
    }

    // Listen for messages from plugin code
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg.type === 'import-progress') {
        showStatus('info', msg.message);
      } else if (msg.type === 'import-success') {
        showStatus('success', msg.message);
        importBtn.disabled = false;
      } else if (msg.type === 'import-error') {
        showStatus('error', msg.message);
        importBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
