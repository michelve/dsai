---
# Codacy Configuration
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/

engines:
  eslint:
    enabled: true
  semgrep:
    enabled: true
  trivy:
    enabled: true

exclude_paths:
  # Coverage reports (auto-generated by Jest)
  - 'coverage/**'
  - '**/*.lcov'
  - '**/lcov-report/**'

  # Build outputs
  - 'dist/**'
  - '**/dist/**'
  - 'out-tsc/**'
  - 'storybook-static/**'
  - '**/*.tsbuildinfo'

  # Dependencies
  - 'node_modules/**'
  - 'pnpm-lock.yaml'

  # Generated files
  - 'static/**'
  - 'packages/@dsai-io/storybook/src/generated/**'

  # Third-party or vendored code
  - '**/vendor/**'
  - '**/third-party/**'

  # Build-time CLI tools
  - 'tools/icons/**'

  # Tools modules excluded from coverage (TODO: add tests later)
  - 'packages/@dsai-io/tools/src/cli/**'
  - 'packages/@dsai-io/tools/src/registry/**'
  - 'packages/@dsai-io/tools/src/tokens/build.ts'
  - 'packages/@dsai-io/tools/src/tokens/mode-extractor.ts'
  - 'packages/@dsai-io/tools/src/tokens/mode-preprocessor.ts'
  - 'packages/@dsai-io/tools/src/tokens/snapshot.ts'
  - 'packages/@dsai-io/tools/src/tokens/theme-builder.ts'
  - 'packages/@dsai-io/tools/src/tokens/theme-discovery.ts'
  - 'packages/@dsai-io/tools/src/tokens/style-dictionary/**'
  - 'packages/@dsai-io/tools/src/tokens/framework-mappers/**'

  # Nx and cache
  - '.nx/**'
  - '/tmp/jest-cache/**'

  # Test fixtures and mocks
  - '**/test/mocks/**'
  - '**/test/fixtures/**'

  # Miscellaneous
  - '.temp/**'
  - '.github/workflows/**'
  - '.claude/**'
  - '.worktrees/**'

  # Documentation and completed tasks
  - 'tasks/completed/**'
  - 'docs/**'
  - '**/*.md'
