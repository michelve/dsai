---
# Codacy Configuration
# Excludes auto-generated files and directories from analysis

engines:
  # Enable recommended analysis tools
  eslint:
    enabled: true
  semgrep:
    enabled: true

exclude_paths:
  # Coverage reports (auto-generated by Jest)
  - 'coverage/**'
  - '**/*.lcov'
  - '**/lcov-report/**'

  # Build outputs
  - 'dist/**'
  - 'out-tsc/**'
  - 'storybook-static/**'
  - '**/*.tsbuildinfo'

  # Dependencies
  - 'node_modules/**'
  - 'pnpm-lock.yaml'

  # Generated static files
  - 'static/**'

  # Third-party or vendored code
  - '**/vendor/**'
  - '**/third-party/**'

  # Build-time CLI tools (not web servers, have proper security controls)
  # These tools run locally with env vars and validate all paths/URLs
  - 'tools/icons/**'

  # Miscellaneous
  - '.temp/**'
  - '.github/workflows/**'
