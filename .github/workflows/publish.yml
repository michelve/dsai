name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (all, tools, react, figma-tokens, storybook, docs)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - tools
          - react
          - figma-tokens
          - storybook
          - docs

permissions:
  id-token: write # Required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify npm version
        run: |
          npm --version
          echo "npm 11.5.1+ required for trusted publishing"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Build publishable packages
        run: pnpm nx run-many --target=build --projects=@dsai-io/tools,@dsai-io/figma-tokens,@dsai-io/react,@dsai-io/storybook,@dsai-io/docs

      # Replace workspace:* with actual versions for publishing
      - name: Prepare packages for publishing
        run: |
          # Get versions from package.json files
          TOOLS_VERSION=$(node -p "require('./packages/@dsai-io/tools/package.json').version")
          REACT_VERSION=$(node -p "require('./packages/@dsai-io/react/package.json').version")
          FIGMA_VERSION=$(node -p "require('./packages/@dsai-io/figma-tokens/package.json').version")

          echo "Versions: tools=$TOOLS_VERSION, react=$REACT_VERSION, figma=$FIGMA_VERSION"

          # Update figma-tokens
          sed -i 's/"@dsai-io\/tools": "workspace:\*"/"@dsai-io\/tools": "^'"$TOOLS_VERSION"'"/' packages/@dsai-io/figma-tokens/package.json

          # Update react
          sed -i 's/"@dsai-io\/tools": "workspace:\*"/"@dsai-io\/tools": "^'"$TOOLS_VERSION"'"/' packages/@dsai-io/react/package.json

          # Update storybook
          sed -i 's/"@dsai-io\/tools": "workspace:\*"/"@dsai-io\/tools": "^'"$TOOLS_VERSION"'"/' packages/@dsai-io/storybook/package.json
          sed -i 's/"@dsai-io\/react": "workspace:\*"/"@dsai-io\/react": "^'"$REACT_VERSION"'"/' packages/@dsai-io/storybook/package.json
          sed -i 's/"@dsai-io\/figma-tokens": "workspace:\*"/"@dsai-io\/figma-tokens": "^'"$FIGMA_VERSION"'"/' packages/@dsai-io/storybook/package.json

          # Update docs
          sed -i 's/"@dsai-io\/react": "workspace:\*"/"@dsai-io\/react": "^'"$REACT_VERSION"'"/' packages/@dsai-io/docs/package.json

          echo "Package.json files updated"

      # Publish @dsai-io/tools (base dependency)
      - name: Publish @dsai-io/tools
        if: github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'tools'
        run: |
          cd packages/@dsai-io/tools
          npm publish
        continue-on-error: false

      # Publish @dsai-io/figma-tokens
      - name: Publish @dsai-io/figma-tokens
        if: github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'figma-tokens'
        run: |
          cd packages/@dsai-io/figma-tokens
          npm publish
        continue-on-error: false

      # Publish @dsai-io/react
      - name: Publish @dsai-io/react
        if: github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'react'
        run: |
          cd packages/@dsai-io/react
          npm publish
        continue-on-error: false

      # Publish @dsai-io/storybook
      - name: Publish @dsai-io/storybook
        if: github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'storybook'
        run: |
          cd packages/@dsai-io/storybook
          npm publish
        continue-on-error: false

      # Publish @dsai-io/docs
      - name: Publish @dsai-io/docs
        if: github.event_name == 'push' || github.event.inputs.package == 'all' || github.event.inputs.package == 'docs'
        run: |
          cd packages/@dsai-io/docs
          npm publish
        continue-on-error: false
