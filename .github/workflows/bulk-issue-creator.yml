name: Bulk Issue Creator

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Change to 'true' to create issues, leave as 'false' to preview output"
        default: false
        type: boolean
        required: true

permissions:
  issues: write
  contents: read

jobs:
  bulk_issue_creator:
    runs-on: ubuntu-latest
    name: Bulk Issue Creator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate CSV from tasks
        run: |
          echo "📋 Generating CSV from task files..."
          node tools/scripts/github/export-tasks-to-github-csv.cjs
          echo "✅ CSV generated at config/data.csv"
          echo ""
          echo "Preview of generated CSV:"
          head -5 config/data.csv

      - name: Create bulk issues
        uses: benbalter/bulk-issue-creator@v2
        with:
          write: ${{ github.event.inputs.write }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
