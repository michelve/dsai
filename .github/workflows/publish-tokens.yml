name: Publish Tokens Package

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags (e.g., v0.1.0)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

env:
  NODE_VERSION: '25'
  PNPM_VERSION: '10'

jobs:
  publish:
    name: Publish @dsai/tokens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tokens
        run: |
          cd packages/@dsai/tokens
          pnpm tokens:transform
          FIGMA_SOURCE=collections pnpm tokens:validate:figma
          pnpm tokens:validate

      - name: Build tokens package
        run: |
          cd packages/@dsai/tokens
          pnpm build

      - name: Verify build outputs
        run: |
          cd packages/@dsai/tokens
          echo "Checking required outputs..."
          # Core CSS files
          test -f dist/css/variables.css || exit 1
          test -f dist/css/dsai.css || exit 1
          test -f dist/css/dsai.min.css || exit 1
          test -f dist/css/dsai-theme-bs.css || exit 1
          test -f dist/css/dsai-theme-bs.min.css || exit 1
          # SCSS files
          test -f dist/scss/_variables.scss || exit 1
          # JavaScript files
          test -f dist/js/tokens.js || exit 1
          test -f dist/js/tokens.cjs || exit 1
          # TypeScript files
          test -f dist/ts/tokens.ts || exit 1
          test -f dist/ts/tokens.d.ts || exit 1
          # JSON files
          test -f dist/json/tokens.json || exit 1
          test -f dist/json/tokens-nested.json || exit 1
          # Module entry points
          test -f dist/index.js || exit 1
          test -f dist/index.mjs || exit 1
          test -f dist/index.d.ts || exit 1
          echo "✅ All outputs verified"

      - name: Check for undefined values
        run: |
          cd packages/@dsai/tokens
          if grep -r "undefined" dist/css dist/scss dist/js 2>/dev/null; then
            echo "❌ Found undefined values in outputs!"
            exit 1
          fi
          echo "✅ No undefined values found"

      - name: Publish to npm
        run: |
          cd packages/@dsai/tokens
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packages/@dsai/tokens/dist/css/variables.css
            packages/@dsai/tokens/dist/css/dsai.css
            packages/@dsai/tokens/dist/css/dsai.min.css
            packages/@dsai/tokens/dist/css/dsai-theme-bs.css
            packages/@dsai/tokens/dist/css/dsai-theme-bs.min.css
            packages/@dsai/tokens/dist/scss/_variables.scss
            packages/@dsai/tokens/dist/js/tokens.js
            packages/@dsai/tokens/dist/json/tokens.json
          generate_release_notes: true
          body: |
            ## @dsai/tokens Release

            ### 📦 Package Information
            - **Version**: ${{ github.ref_name }}
            - **Node.js**: v${{ env.NODE_VERSION }}
            - **DTCG Compliant**: ✅ W3C Standard
            - **Style Dictionary**: v5.1.1

            ### 📥 Installation
            ```bash
            npm install @dsai/tokens@${{ github.ref_name }}
            # or
            pnpm add @dsai/tokens@${{ github.ref_name }}
            ```

            ### 🎨 CSS Imports
            ```css
            /* Full theme with Bootstrap overrides */
            @import '@dsai/tokens/css/dsai-theme-bs.css';

            /* Core design tokens only */
            @import '@dsai/tokens/css/dsai.css';

            /* CSS custom properties */
            @import '@dsai/tokens/css/variables.css';
            ```

            ### 📚 Documentation
            See [packages/@dsai/tokens/README.md](./packages/@dsai/tokens/README.md) for usage instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
